  document.getElementById('btn-export-pdf').addEventListener('click', async () => {
    if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
      toast('需要联网加载 html2canvas / jsPDF 才能导出 PDF');
      return;
    }
    const btn = document.getElementById('btn-export-pdf');
    const original = btn.textContent;
    btn.textContent = '正在生成…';
    btn.disabled = true;
    // 临时插入计算过程附录(导出完成后立即移除,不影响正常使用)
    const target = document.getElementById('report-area');
    const appendix = document.createElement('div');
    appendix.id = 'calc-appendix-tmp';
    appendix.innerHTML = buildCalcAppendix();
    target.appendChild(appendix);
    try {
      const canvas = await html2canvas(target, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#f4f1e9',
        logging: false
      });
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const pdfW = pdf.internal.pageSize.getWidth();
      const pdfH = pdf.internal.pageSize.getHeight();
      const margin = 10;
      const imgW = pdfW - margin * 2;
      const imgH = canvas.height * imgW / canvas.width;
      let heightLeft = imgH;
      let position = margin;
      pdf.addImage(imgData, 'PNG', margin, position, imgW, imgH);
      heightLeft -= (pdfH - margin * 2);
      while (heightLeft > 0) {
        position = heightLeft - imgH + margin;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', margin, position, imgW, imgH);
        heightLeft -= (pdfH - margin * 2);
      }
      const fname = (state.projectName || '评价报告') + '_' + (state.date || new Date().toISOString().slice(0, 10)) + '.pdf';
      pdf.save(fname.replace(/[\\/:*?"<>|]/g, '_'));
      btn.textContent = '已导出';
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
    } catch(e) {
      console.error(e);
      btn.textContent = '导出失败';
      toast('PDF 导出失败:' + e.message);
      setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2500);
    } finally {
      appendix.remove();
    }
  });

  // ============ Migration Banner (v1 → v2) ============
  const MIGRATION_DISMISS_KEY = 'industry-chain-eval-v2-migrated';

  function renderMigrationBanner() {
    if (!pendingMigration) return;
    if (localStorage.getItem(MIGRATION_DISMISS_KEY) === '1') {
      pendingMigration = null;
      return;
    }
    const { count, inconsistentIds } = pendingMigration;
    // 找出这些 id 对应的指标名
    const lookupName = (id) => {
      for (const d of state.dims) {
        const f = (d.indicators || []).find(x => x.id === id);
        if (f) return f.name;
      }
      return id;
    };
    let warnHtml = '';
    if (inconsistentIds && inconsistentIds.length) {
      const list = inconsistentIds.map(id => lookupName(id)).join('、');
      warnHtml = `<br><strong>偏离较大的指标(${inconsistentIds.length}):</strong><span style="color:var(--vermilion);">${escapeHTML(list)}</span>。<br>原因是历史手填分数与新默认数据不一致。展开行内「▸ 计算式」复核数据,如口径不同请调整输入。`;
    }
    const banner = document.createElement('div');
    banner.className = 'migration-banner';
    banner.id = 'migration-banner';
    banner.innerHTML = `
      <span class="mb-icon">v2</span>
      <div class="mb-text">
        <strong>评分体系已升级到 v2。</strong>
        你的 <strong>${count}</strong> 个历史手填得分已按 ID 匹配到结构化数据,自动重算并展示。
        如需微调,展开行内「▸ 计算式」面板即可输入原始数据,得分会随之更新。${warnHtml}
      </div>
      <button class="mb-dismiss" id="mb-dismiss">知道了</button>
    `;
    const report = document.getElementById('report-area');
    if (report.firstElementChild) {
      report.insertBefore(banner, report.firstElementChild);
    } else {
      report.appendChild(banner);
    }
    document.getElementById('mb-dismiss').addEventListener('click', () => {
      try { localStorage.setItem(MIGRATION_DISMISS_KEY, '1'); } catch(_) {}
      banner.remove();
      pendingMigration = null;
    });
  }

  // ============ Calc Appendix (PDF export only) ============
  function formatBasisAsText(basis) {
    if (!basis) return '—';
    switch (basis.type) {
      case SCORE_TYPES.WEIGHTED_AVG:
        return (basis.items || []).map(it =>
          (it.label || '?') + ': 权重=' + (it.weight != null ? it.weight : '—') +
          ', 比率=' + (it.rate != null ? it.rate : '—') + '%'
        ).join('; ');
      case SCORE_TYPES.EQUAL_AVG:
        return (basis.items || []).map(it =>
          (it.label || '?') + ': ' + (it.rate != null ? it.rate : '—') + '%'
        ).join('; ');
      case SCORE_TYPES.TIERED:
        return '输入=' + (basis.input != null ? basis.input : '—') +
          (basis.unit === 'percent' ? '%' : '') +
          '; 档位: ' + (basis.brackets || []).map(b => '≥' + b.min + '→' + b.score).join(', ');
      case SCORE_TYPES.COMPOUND_TIERED:
        return (basis.labels ? (basis.labels.a + '=' + (basis.a != null ? basis.a : '—')) : 'a=' + (basis.a != null ? basis.a : '—')) +
          '; ' + (basis.labels ? (basis.labels.b + '=' + (basis.b != null ? basis.b : '—')) : 'b=' + (basis.b != null ? basis.b : '—')) +
          '; 查表 → ' + (function () {
            const aB = basis.aBrackets || [], bB = basis.bBrackets || [];
            const t = basis.table || [];
            let ai = 0, bi = 0;
            for (let i = 0; i < aB.length; i++) if (basis.a >= aB[i].min) ai = i;
            for (let i = 0; i < bB.length; i++) if (basis.b >= bB[i].min) bi = i;
            ai = Math.min(ai, t.length - 1);
            bi = Math.min(bi, (t[ai] || []).length - 1);
            return (t[ai] && t[ai][bi] != null) ? t[ai][bi] : '—';
          })();
      case SCORE_TYPES.RUBRIC:
        return (basis.items || []).map(it =>
          (it.label || '?') + '=' + (it.score != null ? it.score : '—')
        ).join('; ');
      default:
        return '—';
    }
  }

  function buildCalcAppendix() {
    const rows = [];
    state.dims.forEach(dim => {
      dim.indicators.forEach((ind, i) => {
        const basis = ind.score_basis || { type: SCORE_TYPES.RUBRIC, items: [] };
        const result = computeFromBasis(basis);
        rows.push({ dim, ind, basis, result, idx: i + 1 });
      });
    });
    const cards = rows.map(r => `
      <div style="margin-bottom:10px;padding:9px 12px;border:1px solid var(--rule);background:var(--surface);page-break-inside:avoid;">
        <div style="font-family:var(--serif);font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px;display:flex;justify-content:space-between;align-items:baseline;">
          <span><span style="font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:400;">${escapeHTML(r.dim.code)} · ${String(r.idx).padStart(2, '0')}</span>　${escapeHTML(r.ind.name)}</span>
          <span style="font-family:var(--mono);font-size:14px;color:var(--vermilion);font-weight:600;">${r.result.nullish ? '—' : r.result.val.toFixed(1)}</span>
        </div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-bottom:2px;">${escapeHTML(formulaText(r.basis))}</div>
        <div style="font-family:var(--sans);font-size:11px;color:var(--ink-2);line-height:1.55;">${escapeHTML(formatBasisAsText(r.basis))}</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--vermilion);margin-top:3px;">${escapeHTML(r.result.expr)} → 等级 ${gradeFor(r.result.val).letter}</div>
      </div>
    `).join('');
    return `
      <div class="calc-appendix" style="padding:24px 36px;border-top:4px double var(--ink);margin-top:24px;">
        <div style="font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:14px;">
          计算过程附录
          <span style="font-size:11px;color:var(--ink-3);font-weight:normal;letter-spacing:2px;margin-left:8px;">CALCULATION APPENDIX · 共 ${rows.length} 项</span>
        </div>
        ${cards}
        <div style="margin-top:14px;padding-top:8px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:1px;text-align:right;">
          总分计算 = Σ(维度权重 × 维度得分) / Σ维度权重 = ${calcTotal().toFixed(1)}
        </div>
      </div>
    `;
  }

// ============ Modal ============
  function openModal(html, onConfirm) {
    const overlay = document.getElementById('modal-overlay');
    document.getElementById('modal-content').innerHTML = html;
    overlay.classList.add('show');
    const close = () => overlay.classList.remove('show');
    overlay.querySelectorAll('[data-modal="cancel"]').forEach(b => b.addEventListener('click', close));
    overlay.querySelectorAll('[data-modal="ok"]').forEach(b => b.addEventListener('click', () => {
      const proceed = onConfirm ? onConfirm(b) : true;
      if (proceed !== false) close();
    }));
  }

  // ============ Toast ============
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ============ Init ============
  function init() {
    state = loadState();
    renderGradeLegend();
    render();
    if (pendingMigration) renderMigrationBanner();

    // CDN 加载检测
    setTimeout(() => {
      if (typeof echarts === 'undefined') {
        document.getElementById('radar-chart').style.display = 'none';
        document.getElementById('radar-fallback').style.display = 'block';
      }
      if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
        document.getElementById('btn-export-pdf').disabled = true;
        document.getElementById('btn-export-pdf').title = '需要联网加载 html2canvas/jsPDF 才能导出 PDF';
      }
    }, 500);

    window.addEventListener('resize', () => { if (radarChart) radarChart.resize(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
